<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavify – Music for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Chota sa fix taaki layout break na ho */
    .hidden { display: none !important; }
    #ytContainer { position: absolute; top: -1000px; left: -1000px; }
  </style>
</head>
<body>

  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-text">Wavify</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-page="home">Home</button>
        <button class="nav-btn" data-page="search">Search</button>
        <button class="nav-btn" data-page="library">Library</button>
      </nav>
    </aside>

    <main id="main">
      
      <section class="page active" id="page-home">
        <header class="page-header">
          <h1 id="greeting">Good Evening</h1>
        </header>

        <section class="section">
          <h2>Trending Now 🔥</h2>
          <div class="cards-row" id="trendingRow">
            <p style="padding: 20px; color: #5a5a72;">Loading music...</p>
          </div>
        </section>
      </section>

      <section class="page" id="page-search">
        <div class="search-container">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search songs or artists..." autocomplete="off" />
          </div>
        </div>

        <div id="searchDefault">
          <p class="search-hint">Find your favorite music</p>
        </div>

        <div id="searchResults" style="display:none">
          <div class="results-list" id="resultsList"></div>
        </div>
      </section>

      <section class="page" id="page-library">
        <h1>Your Library</h1>
        <p style="color: #a0a0b8; margin-top: 20px;">Saved songs will appear here.</p>
      </section>

    </main>

    <div id="miniPlayer" class="hidden">
      <div class="mini-thumb-wrap">
        <img id="miniThumb" src="" alt="" />
      </div>
      <div class="mini-info">
        <p class="mini-title" id="miniTitle">Song Title</p>
      </div>
      <div class="mini-controls">
        <button class="ctrl-btn" id="miniPlay">Play/Pause</button>
      </div>
      <div class="mini-progress">
        <div class="mini-progress-bar" id="miniProgressBar"></div>
      </div>
    </div>

    <div id="ytContainer">
      <div id="ytPlayer"></div>
    </div>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
