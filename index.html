<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavify – Premium Music</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="logo">Wavify</div>
            <nav>
                <button class="nav-item active" data-page="home">Home</button>
                <button class="nav-item" data-page="search">Search</button>
                <button class="nav-item" data-page="library">Library</button>
            </nav>
            <div class="sidebar-section">
                <p class="section-title">Your Collection</p>
                <button class="action-btn" id="likedSongsBtn">Liked Songs</button>
            </div>
        </aside>

        <main id="main">
            <section class="page active" id="page-home">
                <header><h1>Good Evening</h1></header>
                <div class="section">
                    <h2>Trending Now 🔥</h2>
                    <div class="cards-grid" id="trendingRow">
                        </div>
                </div>
                <div class="section" id="recentSection" style="display:none">
                    <h2>Recently Played</h2>
                    <div class="cards-grid" id="recentRow"></div>
                </div>
            </section>

            <section class="page" id="page-search">
                <div class="search-bar-wrap">
                    <input type="text" id="searchInput" placeholder="What do you want to listen to?" autocomplete="off">
                </div>
                <div id="searchResults" class="results-container">
                    <div class="results-list" id="resultsList"></div>
                </div>
            </section>
        </main>

        <div id="playerBar" class="player-bar hidden">
            <div class="track-info" id="openFullPlayer">
                <img id="playerThumb" src="" alt="">
                <div class="text">
                    <div id="playerTitle" class="title"></div>
                    <div id="playerArtist" class="artist"></div>
                </div>
            </div>
            <div class="player-controls">
                <div class="btns">
                    <button id="prevBtn" class="ctrl-icon secondary">⏮</button>
                    <button id="playPauseBtn" class="play-trigger">▶</button>
                    <button id="nextBtn" class="ctrl-icon secondary">⏭</button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bg" id="progressClickArea">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="extra-controls">
                <button id="shuffleBtn" class="ctrl-icon secondary">🔀</button>
                <button id="repeatBtn" class="ctrl-icon secondary">🔁</button>
            </div>
        </div>

        <div id="ytWrapper" style="display:none"><div id="ytIframe"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
