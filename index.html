<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavify – Music Streaming</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="logo">Wavify</div>
            <nav>
                <button class="nav-item active" data-page="home">Home</button>
                <button class="nav-item" data-page="search">Search</button>
                <button class="nav-item" data-page="library">Library</button>
            </nav>
        </aside>

        <main id="main">
            <section class="page active" id="page-home">
                <h1>Good Evening</h1>
                <div class="section">
                    <h2>Trending Now 🔥</h2>
                    <div class="cards-grid" id="trendingRow">
                        <div class="shimmer"></div><div class="shimmer"></div>
                    </div>
                </div>
            </section>

            <section class="page" id="page-search">
                <div class="search-bar-wrap">
                    <input type="text" id="searchInput" placeholder="Search songs or artists..." autocomplete="off">
                </div>
                <div id="searchResults" class="results-container">
                    <div class="results-list" id="resultsList"></div>
                    <p id="noResults" class="hidden">No results found.</p>
                </div>
            </section>
        </main>

        <div id="playerBar" class="player-bar hidden">
            <div class="track-info">
                <img id="playerThumb" src="" alt="">
                <div class="text">
                    <div id="playerTitle" class="title">Song Title</div>
                    <div id="playerArtist" class="artist">Artist Name</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-btns">
                    <button id="shuffleBtn" class="sub-btn">🔀</button>
                    <button id="prevBtn" class="sub-btn">⏮</button>
                    <button id="playPauseBtn" class="main-play">▶</button>
                    <button id="nextBtn" class="sub-btn">⏭</button>
                    <button id="repeatBtn" class="sub-btn">🔁</button>
                </div>
                <div class="progress-area">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bg" id="progressContainer">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div class="volume-control">
                <input type="range" id="volumeSlider" min="0" max="100" value="80">
            </div>
        </div>

        <div id="ytWrapper" style="display:none"><div id="ytIframe"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
